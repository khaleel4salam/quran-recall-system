<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hifz Pro - Active Recall</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <button id="mobile-menu-toggle" class="mobile-only-btn">
        <span class="material-symbols-rounded">menu</span>
    </button>
    
    <div class="app-grid">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Hifz Pro</h1>
                <p class="subtitle">Active Recall Workstation</p>
            </header>
    
            <div id="setup-panel" class="panel-content">
                <label>Select Surahs</label>
                <select id="surah-select" multiple size="12"></select>
                <button id="btn-start" class="btn primary">Start Session</button>
            </div>
    
            <div id="session-info" class="session-info hidden">
                <div class="status-card">
                    <span id="current-surah-display">--</span>
                    <small id="ayah-number-display">Ayah --</small>
                </div>
            </div>
    
            <footer class="sidebar-footer">
                <p>Data provided by <a href="https://tanzil.net" target="_blank">Tanzil.net</a></p>
            </footer>
        </aside>
    
        <main class="main-stage">
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">📖</div>
                <h2>Hifz Pro</h2>
                <p>Select a Surah from the sidebar to begin your recall session.</p>
            </div>
    
            <section id="session-panel" class="hidden">
                <div class="focus-area">
                    <div class="trigger-card">
                        <span class="badge">Recall Trigger</span>
                        <div id="verse-trigger" class="arabic-text trigger-text"></div>
                    </div>
                    <div id="revealed-container" class="reveal-flow"></div>
                </div>
    
                <div class="action-dock">
                    <button id="btn-reset" class="dock-btn danger" title="End Session">
                        <span class="material-symbols-rounded">logout</span>
                    </button>
                    <button id="btn-reveal" class="dock-btn primary" title="Reveal Next">
                        <span class="material-symbols-rounded">visibility</span>
                    </button>
                    <button id="btn-next" class="dock-btn secondary" title="Next Challenge">
                        <span class="material-symbols-rounded">skip_next</span>
                    </button>
                </div>
            </section>
        </main>
    </div>
    
    <div id="feedback-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Share Your Feedback</h3>
                <button id="close-modal" class="close-btn"><span class="material-symbols-rounded">close</span></button>
            </div>
            <p class="modal-desc">How was your experience with the workstation?</p>
            
            <form id="feedback-form">
                <div class="field">
                    <label for="fb-name">Name</label>
                    <input type="text" id="fb-name" name="name" required placeholder="Your name">
                </div>
                <div class="field">
                    <label for="fb-message">Message</label>
                    <textarea id="fb-message" name="message" required placeholder="Suggestions..."></textarea>
                </div>
                <button type="submit" id="fb-submit" class="btn primary">Send Feedback</button>
            </form>
            
            <div id="fb-success" class="hidden">
                <p class="success-msg">✅ Thank you! Feedback sent.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
